<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคำสั่งซื้อ (Admin) — DAYDREAM HAIR</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrapper {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      overflow-x: auto;
    }

    #ordersTable {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1.1rem 1.25rem;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    #ordersTable thead th {
      background-color: var(--bg-secondary);
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    #ordersTable tbody tr:hover {
      background-color: rgba(243, 239, 234, 0.45);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">DAYDREAM HAIR</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
          <li><a href="admin.html" class="active">Admin Orders</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Admin Orders Section -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <span class="eyebrow">Management</span>
        <h1>รายการคำสั่งซื้อทั้งหมด</h1>
        <div class="divider-line"></div>
        <p>ข้อมูลคำสั่งซื้อล่าสุดจากระบบ (เรียงจากรายการล่าสุดขึ้นก่อน)</p>
      </div>

      <div class="table-wrapper">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>วันเวลา</th>
              <th>ชื่อลูกค้า</th>
              <th>เบอร์โทร/Line</th>
              <th>รายการสินค้า</th>
              <th>จำนวนเงินรวม</th>
              <th>หมายเหตุ</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logo">DAYDREAM HAIR</div>
      <p class="footer-copy">&copy; 2026 DAYDREAM HAIR. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

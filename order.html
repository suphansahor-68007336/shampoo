<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — DAYDREAM HAIR</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-box {
      max-width: 640px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: var(--space-md);
    }

    .form-actions {
      margin-top: var(--space-md);
      text-align: center;
    }

    .form-actions .btn {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">DAYDREAM HAIR</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
          <li><a href="order.html" class="active">สั่งซื้อสินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Order Section -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <span class="eyebrow">Checkout</span>
        <h1>แบบฟอร์มสั่งซื้อสินค้า</h1>
        <div class="divider-line"></div>
        <p>กรุณากรอกข้อมูลการจัดส่งและตรวจสอบรายการสินค้าของคุณด้านล่าง</p>
      </div>

      <div class="order-box">
        <form id="orderForm">
          <div class="form-group">
            <label for="customerName" class="form-label">ชื่อลูกค้า *</label>
            <input type="text" id="customerName" name="customerName" class="form-control" placeholder="ระบุชื่อ - นามสกุล" required>
          </div>

          <div class="form-group">
            <label for="contact" class="form-label">เบอร์โทร / Line ID *</label>
            <input type="text" id="contact" name="contact" class="form-control" placeholder="เช่น 081-234-5678 หรือ Line: daydream" required>
          </div>

          <div class="form-group">
            <label for="items" class="form-label">รายการสินค้า *</label>
            <input type="text" id="items" name="items" class="form-control" placeholder="ระบุชื่อสินค้าและจำนวน" required>
          </div>

          <div class="form-group">
            <label for="total" class="form-label">จำนวนเงินรวม (บาท) *</label>
            <input type="number" id="total" name="total" class="form-control" placeholder="0" required>
          </div>

          <div class="form-group">
            <label for="note" class="form-label">หมายเหตุ / ที่อยู่จัดส่งเพิ่มเติม</label>
            <textarea id="note" name="note" rows="3" class="form-control" placeholder="ระบุที่อยู่จัดส่งหรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-accent">ยืนยันสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logo">DAYDREAM HAIR</div>
      <p class="footer-copy">&copy; 2026 DAYDREAM HAIR. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

    #filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: var(--space-lg);
    }

    #filter-bar .btn.active {
      background-color: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">

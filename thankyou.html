<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับคำสั่งซื้อ — DAYDREAM HAIR</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou-section {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .thankyou-box {
      max-width: 560px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: var(--space-lg) var(--space-md);
    }

    .thankyou-box p {
      margin-bottom: var(--space-md);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">DAYDREAM HAIR</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
          <li><a href="order.html">สั่งซื้อสินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Thank You Section -->
  <section class="section thankyou-section">
    <div class="container">
      <div class="thankyou-box">
        <span class="eyebrow">Order Received</span>
        <h1>ขอบคุณสำหรับคำสั่งซื้อ</h1>
        <div class="divider-line"></div>
        <p>
          เราได้รับข้อมูลคำสั่งซื้อของคุณเรียบร้อยแล้ว<br>
          ทีมงานจะรีบติดต่อกลับเพื่อยืนยันรายละเอียดและจัดส่งสินค้าให้คุณโดยเร็วที่สุด
        </p>
        <a href="index.html" class="btn">กลับหน้าแรก</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logo">DAYDREAM HAIR</div>
      <p class="footer-copy">&copy; 2026 DAYDREAM HAIR. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
